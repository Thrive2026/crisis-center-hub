<style>
:root{
  --thrive-blue:#3c50a0; --thrive-blue-deep:#283c8c; --thrive-blue-dark:#1a2861;
  --thrive-yellow:#f0c814; --thrive-pink:#c83c8c; --thrive-green:#3cb43c;
  --bg:#f7f3ec; --paper:#ffffff; --ink:#1a2861; --ink-soft:#3e4a78;
  --muted:#8089a8; --rule:#e6dfd2; --rule-strong:#cdc4b2;
  --accent:var(--thrive-yellow); --accent-soft:#fbeec0;
  --good:#2d8c30; --good-soft:#dcf0dc;
  --warn:#a07e0a; --warn-soft:#fbf0c4;

*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:1px}
::-webkit-scrollbar-track{background:transparent}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-0.01em;color:var(--ink);margin:0}
h1{font-size:28px;font-weight:400;letter-spacing:-0.02em}
h2{font-size:20px;font-weight:500}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--thrive-blue);font-weight:600;margin-bottom:6px}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:400;letter-spacing:-0.02em}
.mono{font-family:'IBM Plex Mono',monospace}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.menu-btn{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:4px;cursor:pointer;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.nav-backdrop{display:none}
@media(max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{display:none !important}
  .side.open{display:flex !important;position:fixed;top:0;left:0;height:100vh;width:240px;max-width:82vw;z-index:300}
  .nav-backdrop.open{display:block;position:fixed;inset:0;background:rgba(10,16,50,.5);z-index:290}
  .menu-btn{display:inline-flex !important}
}
nav.side{background:var(--thrive-blue-dark);color:#cdd4f0;border-right:1px solid #0e1638;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
nav.side .brand{padding:18px 20px;border-bottom:1px solid #0e1638;display:flex;align-items:center;gap:12px}
nav.side .brand .text{display:flex;flex-direction:column;line-height:1.15}
nav.side .brand .mark{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:17px;color:#fff}
nav.side .brand .sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#8993c4;font-weight:500;margin-top:2px}
nav.side .group{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#8993c4;padding:18px 20px 6px;font-weight:600}
nav.side .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#dde2f5;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer;transition:background .15s, border-color .15s;background:transparent;border-top:none;border-right:none;border-bottom:none;font-family:inherit;text-align:left;width:100%}
nav.side .nav-item:hover{background:rgba(60,80,160,.5)}
nav.side .nav-item.active{background:var(--thrive-blue);border-left-color:var(--thrive-yellow);color:#fff;font-weight:500}

header.topbar{background:linear-gradient(95deg, var(--thrive-blue-deep) 0%, var(--thrive-blue) 100%);color:#f5f1e8;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:3px solid var(--thrive-yellow);position:sticky;top:0;z-index:50;flex-wrap:wrap}

header.topbar .role-btn .val{font-size:12px;font-weight:600;color:#fff;line-height:1.3}
header.topbar .icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);width:28px;height:28px;border-radius:50%;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.menu-dd{position:absolute;background:var(--paper);border:1px solid var(--rule);border-radius:3px;box-shadow:0 12px 32px rgba(26,40,97,.18);min-width:200px;overflow:hidden;z-index:200}

.cp{padding:18px 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.metric{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:14px 18px;box-shadow:var(--shadow);position:relative}
.mval{font-family:'Fraunces',serif;font-size:30px;font-weight:400;letter-spacing:-0.02em;color:var(--ink);line-height:1.1}
.mlbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.btn-n{background:var(--ink);color:#fff;border:none;padding:8px 16px;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;letter-spacing:.04em;border-radius:2px;cursor:pointer;transition:background .15s}
.btn-n:hover{background:var(--navy)}
.btn-n:disabled{opacity:.45;cursor:not-allowed}
.btn-g{background:transparent;color:var(--ink-soft);border:1px solid var(--rule-strong);padding:8px 14px;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;border-radius:2px;cursor:pointer;transition:background .15s}
.btn-g:hover{background:#f1ead9;color:var(--ink)}
.btn-t{background:var(--accent);color:var(--ink);border:none;padding:8px 14px;font-size:12px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;letter-spacing:.04em;border-radius:2px;cursor:pointer;transition:filter .15s}
.btn-t:hover{filter:brightness(.94)}
.btn-r{background:var(--bad-soft);color:var(--bad);border:1px solid #e7b8d0;padding:6px 12px;font-size:11.5px;font-weight:600;border-radius:2px;cursor:pointer;font-family:inherit}
.btn-ok{background:var(--good-soft);color:var(--good);border:1px solid #a9dcae;padding:6px 12px;font-size:11.5px;font-weight:600;border-radius:2px;cursor:pointer;font-family:inherit}
.inp{width:100%;padding:8px 12px;border-radius:2px;border:1px solid var(--rule-strong);font-size:13px;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px}
.fld{margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule-strong);padding:10px 10px 8px;background:#faf6ee;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:#fcfaf4}
.tbl tr:hover td{background:#fbf6ea}
.tbl-wrap{overflow-x:auto}
.bdg{font-size:10.5px;padding:2px 8px;border-radius:2px;font-weight:500;display:inline-block;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em}
.awarn{background:var(--warn-soft);border:1px solid #e9d178;border-radius:3px;padding:10px 14px;font-size:13px;color:var(--warn);font-weight:500}
.ared{background:var(--bad-soft);border:1px solid #e7b8d0;border-radius:3px;padding:9px 14px;font-size:13px;color:var(--bad);font-weight:500}
.agood{background:var(--good-soft);border:1px solid #a9dcae;border-radius:3px;padding:9px 14px;font-size:13px;color:var(--good);font-weight:500}
.mbg{position:fixed;inset:0;background:rgba(26,40,97,.45);backdrop-filter:blur(2px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--paper);border:1px solid var(--rule);border-radius:3px;width:600px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:0 24px 64px rgba(26,40,97,.35);position:relative}
.mbdy{padding:24px}
.mbdy h3{margin-bottom:16px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:1px 6px;border-radius:2px;font-family:'IBM Plex Mono',monospace}

.delta.bad{background:var(--bad-soft);color:var(--bad)}
.delta.neutral{background:#eee9dc;color:var(--ink-soft)}
select,input,button,textarea{font-family:inherit}
textarea.inp{resize:vertical;min-height:70px}
.toast{position:fixed;top:20px;right:20px;background:#1B5E20;color:#fff;padding:9px 16px;border-radius:6px;z-index:9999;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.2)}
.toast.err{background:#B71C1C}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* ---- print (Schedule tab) ---- */
.print-only{display:none}
@media print{
  nav.side, header.topbar, .no-print{display:none !important}

  select.shift-sel{border:none;background:transparent !important;-webkit-appearance:none;appearance:none;pointer-events:none;color:#000}
}

async function loadAll(){
  const rows = await db.get('appdata','key=in.(cc_staff,cc_schedule,cc_requests,cc_supervision,cc_settings)');
  const byKey = {};
  if(rows){ LIVE = true; rows.forEach(r=>{ try{byKey[r.key]=JSON.parse(r.value);}catch(e){} }); }
  STAFF = (byKey.cc_staff && byKey.cc_staff.length) ? byKey.cc_staff : SEED_STAFF;
  SCHEDULE = byKey.cc_schedule || SEED_SCHEDULE;
  REQUESTS = byKey.cc_requests || SEED_REQUESTS;
  SUPERVISION = byKey.cc_supervision || SEED_SUPERVISION;
  SETTINGS = byKey.cc_settings || SEED_SETTINGS;
  ACTIVE_PERIOD = SCHEDULE.periods[SCHEDULE.periods.length-1]?.id;
  // self-seed Supabase on first-ever run so every future viewer reads real data
  const needSeed = !byKey.cc_staff || !byKey.cc_schedule || !byKey.cc_settings;
  if(needSeed && rows!==null){
    if(!byKey.cc_staff) db.upsert('appdata',{key:'cc_staff',value:JSON.stringify(STAFF)});
    if(!byKey.cc_schedule) db.upsert('appdata',{key:'cc_schedule',value:JSON.stringify(SCHEDULE)});
    if(!byKey.cc_requests) db.upsert('appdata',{key:'cc_requests',value:JSON.stringify(REQUESTS)});
    if(!byKey.cc_supervision) db.upsert('appdata',{key:'cc_supervision',value:JSON.stringify(SUPERVISION)});
    if(!byKey.cc_settings) db.upsert('appdata',{key:'cc_settings',value:JSON.stringify(SETTINGS)});
  }
}
async function saveStaff(){ await db.upsert('appdata',{key:'cc_staff',value:JSON.stringify(STAFF)}); }
async function saveSchedule(){ await db.upsert('appdata',{key:'cc_schedule',value:JSON.stringify(SCHEDULE)}); }
async function saveRequests(){ await db.upsert('appdata',{key:'cc_requests',value:JSON.stringify(REQUESTS)}); }
async function saveSupervision(){ await db.upsert('appdata',{key:'cc_supervision',value:JSON.stringify(SUPERVISION)}); }
async function saveSettings(){ await db.upsert('appdata',{key:'cc_settings',value:JSON.stringify(SETTINGS)}); }

function isManager(){return CURRENT && CURRENT.role==='manager';}
function isTeamLead(){return CURRENT && CURRENT.role==='team_lead';}
function canEditRoster(){return isManager();}
function canEditSchedule(){return isManager()||isTeamLead();}
function canSeeSettings(){return isManager();}
function reportsOf(staffId){return STAFF.filter(s=>s.supervisorId===staffId).map(s=>s.id);}
function isSupervisorOf(supId,staffId){
  let cur = byId(staffId);
  let guard=0;
  while(cur && cur.supervisorId!=null && guard<20){
    if(cur.supervisorId===supId) return true;
    cur = byId(cur.supervisorId); guard++;
  }
  return false;
}
// Deactivated staff are excluded everywhere by default — the Schedule
// grid, the main Roster list, the login list (already handled separately
// in renderLogin). The Roster page has its own toggle to reveal them.
function visibleStaffFor(){
  const base = isManager() ? STAFF.slice()
    : isTeamLead() ? STAFF.filter(s=>s.id===CURRENT.id||s.supervisorId===CURRENT.id)
    : STAFF.filter(s=>s.id===CURRENT.id);
  return base.filter(s=>s.status!=='Inactive');
}

      </div>

        <span class="p">${LIVE?'● Live data':'○ Offline seed data'}</span>
      </div>
    </div>
  </div>`;
}
function doLogin(){
  const idSel = document.getElementById('loginName');
  const codeEl = document.getElementById('loginCode');
  const id = parseInt(idSel.value,10);
  const code = (codeEl.value||'').trim();
  if(!id){ renderLogin('Pick your name from the list.'); return; }
  const s = byId(id);
  if(!s || (s.passcode||'')!==code){ renderLogin('That passcode does not match. Try again.'); return; }
  CURRENT = s;
  VIEW = 'dashboard';
  renderShell();
}
function logout(){ CURRENT=null; renderLogin(); }

// SCHEDULE HELPERS
// ══════════════════════════════════════════════════════════
function period(id){return SCHEDULE.periods.find(p=>p.id===id);}
function shiftFor(p,staffId,date){
  const edit = PENDING_SCHED_EDITS[staffId] && PENDING_SCHED_EDITS[staffId][date];
  if(edit!==undefined) return edit;
  return (p.entries[staffId]&&p.entries[staffId][date]) || '';
}
function totalsFor(p,s){
  if(s.role==='manager') return {total:null,target:null,variance:null};
  let total=0;
  p.days.forEach(d=>{ total += HOURS_PER_SHIFT[shiftFor(p,s.id,d)]||0; });
  const target = Math.round((s.fte||0)*(SETTINGS.hoursPerFte||80));
  return {total, target, variance: total-target};
}
function coverageFor(p){
  const shifts = ['8A-4P','4P-12A','12A-8A'];
  const out = {};
  shifts.forEach(sh=>{ out[sh]=p.days.map(d=>STAFF.filter(s=>shiftFor(p,s.id,d)===sh).length); });
  return out;
}
function covClass(n){
  const min=SETTINGS.minPerShift||2, tgt=SETTINGS.targetPerShift||4;
  if(n<min) return 'cov-red';
  if(n<tgt) return 'cov-yellow';
  return 'cov-green';
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
}

async function deleteStaffPermanently(id){
  const s = byId(id);

  const reqs = REQUESTS.filter(r=>r.staffId===id).length;
  const supLogs = SUPERVISION.filter(l=>l.staffId===id||l.loggedBy===id).length;
  const notes = [
    reports?`${reports} ${reports===1?'person still lists':'people still list'} them as shift-lead supervisor`:'',
    reqs?`${reqs} shift request${reqs===1?'':'s'} reference them`:'',
    supLogs?`${supLogs} supervision log ${supLogs===1?'entry references':'entries reference'} them`:'',
  ].filter(Boolean).join('; ');

async function deactivateStaff(id){

  saveStaff();

async function reactivateStaff(id){
  const s = byId(id);
  if(!s) return;

  s.status = 'Active';

function genPasscode(){
  const used = new Set(STAFF.map(s=>s.passcode));
  let c;
  do{ c = String(Math.floor(Math.random()*10000)).padStart(4,'0'); }while(used.has(c));
  return c;
}

  return REQUESTS.find(r=>r.staffId===staffId && r.status==='approved' && !r.appliedToRoster && r.dateList && r.dateList.includes(date));

// Stages (does not save) one person's whole pattern copied from the prior
// period into the active one, position-matched by day-in-period. Useful
// after creating a blank period, or when only a couple of people need to
// be re-synced without touching everyone else's already-edited cells.
function copyPersonFromPrior(staffId){
  const idx = SCHEDULE.periods.findIndex(pp=>pp.id===ACTIVE_PERIOD);
  if(idx<=0){ toast('There is no earlier period to copy from.', true); return; }
  const p = SCHEDULE.periods[idx], prior = SCHEDULE.periods[idx-1];
  PENDING_SCHED_EDITS[staffId] = PENDING_SCHED_EDITS[staffId]||{};
  p.days.forEach((d,i)=>{
    PENDING_SCHED_EDITS[staffId][d] = (prior.entries[staffId]||{})[prior.days[i]] || '';
  });
  toast(nameOf(staffId)+'’s pattern copied from '+prior.label+' — review below, then Save changes.');
  renderView();
}

// ══════════════════════════════════════════════════════════
// ADD NEXT PAY PERIOD — the roster only ever shipped with 3 hardcoded
// periods (through 10/23/26). Without this, once those run out the only
// way to schedule anyone is hand-editing SEED_SCHEDULE in the source file.
// This lets a manager spin up the next 14-day period from inside the hub,
// either blank or pre-filled from the most recent period's pattern shifted
// forward two weeks (most staff repeat the same rotation each cycle, so
// "copy" usually only needs a few exceptions adjusted afterward).
// ══════════════════════════════════════════════════════════
function fmtShort(d){ const dt=new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function nextPeriodRange(){
  const last = SCHEDULE.periods[SCHEDULE.periods.length-1];
  const startDt = new Date(last.end+'T00:00:00'); startDt.setDate(startDt.getDate()+1);
  const days = [];
  for(let i=0;i<14;i++){ const d=new Date(startDt); d.setDate(d.getDate()+i); days.push(d.toISOString().slice(0,10)); }
  return {start:days[0], end:days[13], days};
}
function openAddPeriodModal(){
  const last = SCHEDULE.periods[SCHEDULE.periods.length-1];
  const {start,end} = nextPeriodRange();

  body.innerHTML = `
  <div class="mbox"><div class="mbdy">

    <div class="lede" style="margin-bottom:16px">${fmtShort(start)} – ${fmtShort(end)}/${end.slice(2,4)}. This adds a brand-new pay period after ${esc(last.label)} — pick how it should start out.</div>
    <div class="fld">
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;cursor:pointer">
        <input type="radio" name="ap_mode" value="copy" checked style="margin-top:3px">
        <span><strong>Copy the most recent period's pattern</strong> (${esc(last.label)}), shifted forward two weeks. Fastest option if the rotation mostly repeats — you'll still want to adjust for anyone's approved changes.</span>
      </label>
      <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
        <input type="radio" name="ap_mode" value="blank" style="margin-top:3px">
        <span><strong>Start blank</strong> — every cell empty, build it from scratch.</span>
      </label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn-g" onclick="closeModal()">Cancel</button>
      <button class="btn-n" onclick="createNextPeriod()">Create Period</button>
    </div>
  </div></div>`;
  document.body.appendChild(body);
}
async function createNextPeriod(){
  const mode = document.querySelector('input[name="ap_mode"]:checked').value;
  const last = SCHEDULE.periods[SCHEDULE.periods.length-1];
  const {start,end,days} = nextPeriodRange();
  const label = `${fmtShort(start)} – ${fmtShort(end)}/${end.slice(2,4)}`;
  const entries = {};
  STAFF.forEach(s=>{
    entries[s.id] = {};
    days.forEach((d,i)=>{
      entries[s.id][d] = mode==='copy' ? ((last.entries[s.id]||{})[last.days[i]] || '') : '';
    });
  });
  const newPeriod = {id:'pp-'+start, label, start, end, days, entries};
  SCHEDULE.periods.push(newPeriod);
  ACTIVE_PERIOD = newPeriod.id;
  PENDING_SCHED_EDITS = {};

  closeModal();

function editShift(staffId,date,val){
  PENDING_SCHED_EDITS[staffId] = PENDING_SCHED_EDITS[staffId]||{};

  const p = period(ACTIVE_PERIOD);

  renderView();

async function saveScheduleEdits(){
  const p = period(ACTIVE_PERIOD);
  Object.entries(PENDING_SCHED_EDITS).forEach(([sid,edits])=>{
    p.entries[sid] = p.entries[sid]||{};
    Object.entries(edits).forEach(([d,v])=>{ p.entries[sid][d]=v; });

  saveSchedule();
  toast('Schedule saved.');
  renderView();
}

// ══════════════════════════════════════════════════════════
// STAFFING IMPACT — simulate what a request would do to shift
// coverage BEFORE anyone approves it. Never mutates real state.
// ══════════════════════════════════════════════════════════
// What code would land on the schedule grid if this request is approved.
// Returns null for request types we can't simulate (e.g. "Other").
function requestResultingCode(r){
  if(r.type==='Time off (PTO)') return 'PTO';
  if(r.type==='Sick time') return 'SICK';
  if((r.type==='Shift change'||r.type==='Schedule swap') && r.newShift) return r.newShift;
  return null;
}
// Per affected date, shows the shift the requester is leaving (if any) and
// the shift they'd be joining (if any), each with a before/after headcount
// and a red/yellow/green read using the same thresholds as the Schedule tab.
function coverageImpact(r){
  const code = requestResultingCode(r);
  const s = byId(r.staffId);
  if(!code || !s || !r.dateList || !r.dateList.length) return null;
  return r.dateList.map(d=>{
    const p = SCHEDULE.periods.find(pp=>pp.days.includes(d));
    if(!p) return {date:d, note:'That date isn’t in any published pay period.'};
    const before = shiftFor(p,s.id,d);
    const rows = [];
    if(before && HOURS_PER_SHIFT[before]){
      const nowCount = STAFF.filter(x=>shiftFor(p,x.id,d)===before).length;
      const afterCount = nowCount-1;
      rows.push({date:d, label:'Leaving', shift:before, before:nowCount, after:afterCount, cls:covClass(afterCount)});
    }
    if(code!=='PTO' && code!=='SICK' && code!==before && HOURS_PER_SHIFT[code]){
      const nowCount2 = STAFF.filter(x=>shiftFor(p,x.id,d)===code).length;
      const afterCount2 = nowCount2+1;
      rows.push({date:d, label:'Joining', shift:code, before:nowCount2, after:afterCount2, cls:covClass(afterCount2)});
    }
    return {date:d, rows};
  });
}
function impactTableHtml(impact){
  const anyRed = impact.some(d=>d.rows && d.rows.some(row=>row.cls==='cov-red'));
  const rowsHtml = impact.map(d=>{
    if(d.note) return `<tr><td class="mono">${fmtDate(d.date)}</td><td colspan="4">${esc(d.note)}</td></tr>`;
    if(!d.rows.length) return `<tr><td class="mono">${fmtDate(d.date)}</td><td colspan="4">No scheduled shift that day — no coverage change.</td></tr>`;
    return d.rows.map(row=>`
      <tr>
        <td class="mono">${fmtDate(row.date)}</td>
        <td>${row.label}</td>
        <td class="mono">${esc(row.shift)}</td>
        <td class="mono">${row.before} → ${row.after}</td>
        <td><span class="${row.cls==='cov-red'?'ared':row.cls==='cov-yellow'?'awarn':'agood'}" style="display:inline-block;padding:2px 8px;font-size:11px">${row.cls==='cov-red'?'Below minimum':row.cls==='cov-yellow'?'Acceptable':'At target'}</span></td>
      </tr>`).join('');
  }).join('');
  return `
  ${anyRed?`<div class="ared" style="margin-bottom:10px">Approving this would drop at least one shift below the minimum staffing level on at least one date.</div>`:''}
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Date</th><th></th><th>Shift</th><th>Staff Before → After</th><th>Result</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;
}
function openImpactModal(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r) return;
  const s = byId(r.staffId);
  const impact = coverageImpact(r);
  const body = document.createElement('div');
  body.className='mbg';
  body.innerHTML = `

    <div class="lede" style="margin-bottom:2px">${esc(r.type)} · ${esc(r.dates)}${r.newShift?` → ${esc(r.newShift)}`:''}${r.reason?` — “${esc(r.reason)}”`:''}</div>
    <div class="lede" style="margin-bottom:14px;font-size:11.5px;${((r.status==='pending_lead'||r.status==='pending_manager')&&daysAgo(r.createdAt)>=2)?'color:var(--bad);font-weight:600':''}">Submitted ${fmtShort(r.createdAt.slice(0,10))} (${(()=>{const d=daysAgo(r.createdAt);return d<=0?'today':d===1?'1 day ago':d+' days ago';})()})</div>
    ${impact===null
      ? `<div class="awarn">Staffing impact can’t be auto-checked for this request type — review the Schedule tab manually before deciding.</div>`
      : impactTableHtml(impact)}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
      <button class="btn-g" onclick="closeModal()">Close without deciding</button>
      <button class="btn-r" onclick="decideRequest('${r.id}',false);closeModal()">Deny</button>
      <button class="btn-ok" onclick="decideRequest('${r.id}',true);closeModal()">Approve</button>
    </div>
  </div></div>`;
  document.body.appendChild(body);
}

function statusBadge(st){

// Days between a submission timestamp and now — used to flag requests
// that have been sitting unanswered for a while so they don't get missed.
function daysAgo(iso){
  return Math.floor((Date.now()-new Date(iso).getTime())/86400000);
}
function submittedCellHtml(r){

}

        ${isManager()&&!actionable?`<td>${r.status==='approved'&&r.newShift&&!r.appliedToRoster?`<button class="btn-g" onclick="applyToRoster('${r.id}')">Apply to roster</button>`:(r.appliedToRoster?'<span class="mono" style="font-size:11px;color:var(--good)">Applied ✓</span>':'')}</td>`:''}
      </tr>`).join('')}

// One checkbox per real calendar day across every published pay period, each
// labeled with that person's currently scheduled shift (if any) so they're
// picking real dates the same way the Schedule tab shows them — not typing
// a date string that a coverage check would have to guess how to parse.
function renderDatePicker(s){
  return SCHEDULE.periods.map(p=>`
    <div style="margin-bottom:10px">
      <div class="lbl" style="margin-bottom:6px">${esc(p.label)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${p.days.map(d=>{
          const shift = shiftFor(p,s.id,d);
          return `<label style="display:flex;align-items:center;gap:4px;border:1px solid var(--rule-strong);border-radius:3px;padding:4px 8px;font-size:11.5px;cursor:pointer;background:#fff">
            <input type="checkbox" class="r_date_cb" value="${d}" style="margin:0">

// A plain "Shift change" is a standing change to someone's regular shift
// going forward, not tied to specific dates — so it skips the date picker
// entirely and just needs the new shift. Every other type still needs
// actual date(s) to check staffing impact against.
function onRequestTypeChange(type){
  document.getElementById('r_newshift_fld').style.display = (type==='Shift change'||type==='Schedule swap') ? 'block' : 'none';
  document.getElementById('r_datepicker_fld').style.display = (type==='Shift change') ? 'none' : 'block';
}
async function submitRequest(){
  const type = document.getElementById('r_type').value;
  const reason = document.getElementById('r_reason').value.trim();
  const newShift = document.getElementById('r_newshift').value;
  const needsDates = type!=='Shift change';
  const dateList = needsDates ? Array.from(document.querySelectorAll('.r_date_cb:checked')).map(cb=>cb.value).sort() : [];
  if(needsDates && !dateList.length){ toast('Select at least one date.',true); return; }
  if(type==='Shift change' && !newShift){ toast('Select the desired shift.',true); return; }
  const s = CURRENT;
  const hasLead = s.supervisorId && byId(s.supervisorId) && byId(s.supervisorId).role==='team_lead';
  const rec = {
    id: 'req_'+Date.now(), staffId: s.id, type, reason, newShift: newShift||null,
    dateList, dates: needsDates ? dateList.map(fmtDate).join(', ') : '— (standing shift change)',
    currentShift: s.shift, currentStatus: s.status, dateOfHire: s.dateOfHire,
    status: hasLead ? 'pending_lead' : 'pending_manager',
    leadDecision: null, managerDecision: null,
    createdAt: new Date().toISOString(), appliedToRoster: false,
  };
  REQUESTS.push(rec);
  saveRequests();
  closeModal();
  toast('Request submitted.');
  renderView();
}
async function decideRequest(id, approve){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r) return;
  if(r.status==='pending_lead'){
    r.leadDecision = approve?'approved':'denied';
    r.status = approve ? 'pending_manager' : 'denied';
  } else if(r.status==='pending_manager'){
    r.managerDecision = approve?'approved':'denied';
    r.status = approve?'approved':'denied';
  }
  saveRequests();
  toast(approve?'Approved.':'Denied.');
  renderView();
}
async function applyToRoster(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r || r.appliedToRoster) return;
  const s = byId(r.staffId);
  const code = requestResultingCode(r);
  if(s && code && r.dateList && r.dateList.length){
    const lockedPeriods = new Set();
    r.dateList.forEach(d=>{
      const p = SCHEDULE.periods.find(pp=>pp.days.includes(d));
      if(p && p.locked) lockedPeriods.add(p.label);
    });
    if(lockedPeriods.size){
      toast('Can’t apply — unlock '+Array.from(lockedPeriods).join(', ')+' first, then try again.', true);
      return;
    }
    r.dateList.forEach(d=>{
      const p = SCHEDULE.periods.find(pp=>pp.days.includes(d));
      if(!p) return;
      p.entries[s.id] = p.entries[s.id]||{};
      p.entries[s.id][d] = code;
    });
    saveSchedule();
  }
  // A shift change/swap also updates their standing default shift going
  // forward, not just the specific dates they requested.
  if(s && r.newShift && (r.type==='Shift change'||r.type==='Schedule swap')){
    s.shift = r.newShift;
    s.weeklyTargetHours = Math.round((s.fte||0)*(SETTINGS.hoursPerFte||80));
    saveStaff();
  }
  r.appliedToRoster = true;
  saveRequests();
  toast('Applied to the schedule.');
  renderView();
}

          <td>${esc(nameOf(l.staffId))}</td>
          <td class="mono">${esc(l.date)}</td>
          <td>${esc(nameOf(l.loggedBy))}</td>
          <td>${esc(l.topics)}</td>
          <td>${esc(l.actionItems)}</td>
          <td class="mono">${esc(l.followUpDate||'—')}</td>
        </tr>`).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">No sessions logged yet.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
function openSupModal(){
  const reports = isManager() ? STAFF.filter(s=>s.id!==CURRENT.id) : STAFF.filter(s=>s.supervisorId===CURRENT.id);
  const body = document.createElement('div');
  body.className='mbg';
  body.innerHTML = `
  <div class="mbox"><div class="mbdy">
    <h3>Log Supervision Session</h3>
    <div class="fld"><label class="lbl">Staff Member</label>
      <select class="inp" id="s_staff">${reports.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    </div>
    <div class="fld"><label class="lbl">Date</label><input class="inp" id="s_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="fld"><label class="lbl">Topics Discussed</label><textarea class="inp" id="s_topics"></textarea></div>
    <div class="fld"><label class="lbl">Action Items</label><textarea class="inp" id="s_action"></textarea></div>
    <div class="fld"><label class="lbl">Follow-up Date</label><input class="inp" id="s_followup" type="date"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn-g" onclick="closeModal()">Cancel</button>
      <button class="btn-n" onclick="saveSupSession()">Save</button>
    </div>
  </div></div>`;
  document.body.appendChild(body);
}
async function saveSupSession(){
  const staffId = parseInt(document.getElementById('s_staff').value,10);
  const rec = {
    id: 'sup_'+Date.now(), staffId, loggedBy: CURRENT.id,
    date: document.getElementById('s_date').value,
    topics: document.getElementById('s_topics').value.trim(),
    actionItems: document.getElementById('s_action').value.trim(),
    followUpDate: document.getElementById('s_followup').value,
  };
  SUPERVISION.push(rec);
  saveSupervision();
  closeModal();
  toast('Session logged.');
  renderView();
}

// ══════════════════════════════════════════════════════════
// VIEW: SUPERVISION TREE
// ══════════════════════════════════════════════════════════
function viewTree(){
  const root = STAFF.find(s=>s.role==='manager');
  return `
  <div class="page-hd"><div><div class="eyebrow">Org Chart</div><h1>Supervision Tree</h1><div class="lede">David is supervisor of record for everyone. Harold and Rondye still function as shift leads day-to-day and keep pre-approving requests for their own crew — that's tracked separately and isn't shown here.</div></div></div>
  <div class="card"><div class="orgchart-wrap" id="orgchartWrap">
    ${root ? `<div class="orgchart">${orgBranch(root)}</div><svg class="orgchart-lines" id="orgchartLines"></svg>` : '<div class="lede">No manager on the roster.</div>'}
  </div></div>`;
}
// Flattened by design: every active/onboarding staff member reports directly
// to David for supervision/org-chart purposes, regardless of their actual
// supervisorId (which still drives shift-request pre-approval routing).
function recordChildrenOf(s){
  if(s.role!=='manager') return [];
  return STAFF.filter(x=>x.id!==s.id).sort((a,b)=>a.name.localeCompare(b.name));
}
function orgBranch(s){
  const kids = recordChildrenOf(s);
  const cls = s.role==='manager'?'mgr':(s.role==='team_lead'?'lead':'staff');
  return `<div class="branch">
    <div class="node ${cls}" data-id="${s.id}">
      <div class="node-name">${esc(s.name)}</div>
      <div class="node-role">${roleLabel(s)}</div>
    </div>
    ${kids.length?`<div class="children">${kids.map(orgBranch).join('')}</div>`:''}
  </div>`;
}
function drawOrgLines(centerRoot){
  const wrap = document.getElementById('orgchartWrap');
  const svg = document.getElementById('orgchartLines');
  if(!wrap || !svg) return;
  const w = wrap.scrollWidth, h = wrap.scrollHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const wrapRect = wrap.getBoundingClientRect();
  const pt = (el, edge) => {
    const r = el.getBoundingClientRect();
    const x = r.left - wrapRect.left + wrap.scrollLeft + r.width/2;
    const y = (edge==='bottom' ? r.bottom : r.top) - wrapRect.top + wrap.scrollTop;
    return {x,y};
  };
  let paths = '';
  const mgr = STAFF.find(x=>x.role==='manager');
  STAFF.forEach(s=>{
    if(!mgr || s.id===mgr.id) return;
    const childEl = wrap.querySelector(`.node[data-id="${s.id}"]`);
    const parentEl = wrap.querySelector(`.node[data-id="${mgr.id}"]`);
    if(!childEl || !parentEl) return;
    const p = pt(parentEl,'bottom');
    const c = pt(childEl,'top');
    const midY = p.y + (c.y - p.y) * 0.5;
    paths += `<path d="M${p.x},${p.y} L${p.x},${midY} L${c.x},${midY} L${c.x},${c.y}" fill="none" style="stroke:var(--rule-strong);stroke-width:2"/>`;
  });
  svg.innerHTML = paths;
  // A parent is centered over the full width of its subtree, so with several wide teams
  // the root can end up well outside the initial viewport — start the view centered on
  // whoever's at the top instead of leaving it scrolled to the far left. Only do this on
  // first open, not on every resize, so we don't yank a scroll position out from under
  // someone who's already looking somewhere else in the chart.
  if(centerRoot){
    const rootNode = wrap.querySelector('.orgchart > .branch > .node');
    if(rootNode){
      const r = pt(rootNode,'top');
      wrap.scrollLeft = Math.max(0, r.x - wrap.clientWidth/2);
    }
  }
}

// ══════════════════════════════════════════════════════════
// VIEW: SETTINGS (manager only)
// ══════════════════════════════════════════════════════════
function viewSettings(){
  if(!canSeeSettings()) return `<div class="ared">You don't have access to Settings.</div>`;
  return `
  <div class="page-hd"><div><div class="eyebrow">Manager Only</div><h1>Settings</h1></div></div>
  <div class="g2" style="align-items:start">
    <div class="card">
      <h3 style="margin-bottom:14px">Organization</h3>
      <div class="fld"><label class="lbl">Org Name</label><input class="inp" id="set_org" value="${esc(SETTINGS.orgName||'')}"></div>
      <div class="fld"><label class="lbl">UKG Portal URL</label><input class="inp" id="set_ukg" value="${esc(SETTINGS.ukgUrl||'')}" placeholder="https://..."></div>
      <div class="g2">
        <div class="fld"><label class="lbl">FTE Budget</label><input class="inp" id="set_fte" type="number" value="${SETTINGS.fteBudget||18}"></div>
        <div class="fld"><label class="lbl">Hours / FTE per period</label><input class="inp" id="set_hpf" type="number" value="${SETTINGS.hoursPerFte||80}"></div>
      </div>
      <div class="g2">
        <div class="fld"><label class="lbl">Min Staff / Shift</label><input class="inp" id="set_min" type="number" value="${SETTINGS.minPerShift||2}"></div>
        <div class="fld"><label class="lbl">Target Staff / Shift</label><input class="inp" id="set_tgt" type="number" value="${SETTINGS.targetPerShift||4}"></div>
      </div>
      <button class="btn-n" onclick="saveOrgSettings()">Save Settings</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:14px">Passcodes</h3>
      <div class="lede" style="margin-bottom:10px">Each person signs in with their name and this code.</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Name</th><th>Role</th><th>Passcode</th></tr></thead>
        <tbody>
        ${STAFF.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`
          <tr>
            <td>${esc(s.name)}</td>
            <td>${roleBadge(s)}</td>
            <td><input class="inp mono" style="width:90px" maxlength="4" value="${esc(s.passcode)}" onchange="updatePasscode(${s.id},this.value)"></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <button class="btn-g" style="margin-top:12px" onclick="regenAllPasscodes()">Generate new codes for everyone</button>
    </div>
  </div>`;
}
async function saveOrgSettings(){
  SETTINGS.orgName = document.getElementById('set_org').value.trim();
  SETTINGS.ukgUrl = document.getElementById('set_ukg').value.trim();
  SETTINGS.fteBudget = parseFloat(document.getElementById('set_fte').value)||18;
  SETTINGS.hoursPerFte = parseFloat(document.getElementById('set_hpf').value)||80;
  SETTINGS.minPerShift = parseInt(document.getElementById('set_min').value,10)||2;
  SETTINGS.targetPerShift = parseInt(document.getElementById('set_tgt').value,10)||4;
  saveSettings();
  toast('Settings saved.');
  renderView();
}
async function updatePasscode(id, val){
  const s = byId(id);
  const code = (val||'').trim();
  if(!/^\d{4}$/.test(code)){ toast('Passcode must be 4 digits.',true); renderView(); return; }
  s.passcode = code;
  saveStaff();
  toast('Passcode updated for '+s.name+'.');
}
async function regenAllPasscodes(){
  if(!confirm('Generate a new random passcode for every person? Old codes will stop working immediately.')) return;
  const used = new Set();
  STAFF.forEach(s=>{
    let c; do{ c=String(Math.floor(Math.random()*10000)).padStart(4,'0'); }while(used.has(c));
    used.add(c); s.passcode=c;
  });
  saveStaff();
  toast('New passcodes generated for everyone.');
  renderView();
}
